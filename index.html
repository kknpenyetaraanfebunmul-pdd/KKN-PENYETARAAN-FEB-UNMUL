<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    
    <!-- ========================================================= -->
    <!-- 1. FAVICON (Ikon di Tab Browser)                          -->
    <!-- Ganti "logo.png" jadi "logo.jpg" atau "logo.webp"         -->
    <!-- sesuai format file asli yang kamu simpan di folder images -->
    <!-- ========================================================= -->
    <link rel="icon" type="image/png" href="/images/logo.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7b5ea7" />
    
    <!-- ========================================================= -->
    <!-- 2. JUDUL & DESKRIPSI WEBSITE                              -->
    <!-- ========================================================= -->
    <title>KKN Penyetaraan FEB UNMUL</title>
    <meta name="description" content="Website resmi KKN Penyetaraan FEB Universitas Mulawarman. Membangun desa, mengabdi untuk negeri." />
    
    <!-- ========================================================= -->
    <!-- 3. PREVIEW LINK (WhatsApp, Facebook, LinkedIn, dll)       -->
    <!-- PENTING: Path gambar menggunakan URL LENGKAP (https://)   -->
    <!-- Ganti "og-preview.jpg" jadi ".png" atau ".webp" jika perlu -->
    <!-- ========================================================= -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kkn-penyetaraan-feb-unmul.vercel.app/" />
    <meta property="og:title" content="KKN Penyetaraan FEB UNMUL" />
    <meta property="og:description" content="Membangun desa, mengabdi untuk negeri. Program Kuliah Kerja Nyata Penyetaraan." />
    
    <!-- Ganti bagian .jpg di bawah ini jika format fotonya .png atau .webp -->
    <meta property="og:image" content="https://kkn-penyetaraan-feb-unmul.vercel.app/images/og-preview.jpg" />

    <!-- ========================================================= -->
    <!-- 4. PREVIEW LINK (Twitter / X)                             -->
    <!-- ========================================================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KKN Penyetaraan FEB UNMUL" />
    <meta name="twitter:description" content="Membangun desa, mengabdi untuk negeri. Program Kuliah Kerja Nyata Penyetaraan." />
    
    <!-- Ganti bagian .jpg di bawah ini jika format fotonya .png atau .webp -->
    <meta name="twitter:image" content="https://kkn-penyetaraan-feb-unmul.vercel.app/images/og-preview.jpg" />

    <!-- ========================================================= -->
    <!-- 5. FONTS                                                   -->
    <!-- ========================================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
